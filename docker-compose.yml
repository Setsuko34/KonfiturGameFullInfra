networks:
  konfitur-net:
    name: konfitur-net
    driver: bridge
  appwrite-net:
    name: appwrite-net
    driver: bridge
  runtimes:
    driver: bridge

  monitoring-net:
    name: monitoring-net
    driver: bridge

volumes:
  appwrite-uploads:
  appwrite-config:
  appwrite-certificates:
  appwrite-functions:
  appwrite-builds:
  traefik-acme:
  redis-data:
  mariadb-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:

services:
  # ════════════════════════════════════════
  # TRAEFIK — Reverse Proxy + TLS
  # ════════════════════════════════════════
  traefik:
    image: traefik:v3.6.7
    container_name: konfitur-traefik
    restart: unless-stopped
    environment:
      - ADMIN_EMAIL=${ADMIN_EMAIL}   # Requis par traefik.yml pour ACME/Let's Encrypt
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      # Identifiants du dashboard, hors Git (voir .gitignore). Fichier htpasswd
      # plutôt qu'une variable : le hash bcrypt contient des $ que Docker Compose
      # interpréterait comme des variables et remplacerait par du vide.
      - ./traefik/dashboard-users:/etc/traefik/dashboard-users:ro
      - traefik-acme:/etc/traefik/acme
    networks:
      - konfitur-net
      - appwrite-net
      # Prometheus scrape l'entrypoint `metrics` (:8082) par le réseau interne.
      # Ce port n'est jamais publié sur l'hôte : aucune métrique n'est exposée à Internet.
      - monitoring-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=auth-dashboard@file,security-headers@file"

  # ════════════════════════════════════════
  # FRONTEND — Next.js
  # ════════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APPWRITE_ENDPOINT: https://${DOMAIN}/v1
        NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID}
    # Image nommée et versionnée : c'est le point de retour du frontend.
    # `up -d` avec un tag déjà présent localement ne reconstruit PAS — un
    # rollback est une bascule de variable dans .env, pas un rebuild de
    # plusieurs minutes en pleine panne. Le tag est écrit par
    # scripts/deploy-frontend.sh ; `latest` n'est que le filet du tout premier
    # démarrage, avant qu'un déploiement n'ait posé un SHA.
    image: konfitur-frontend:${FRONTEND_TAG:-latest}
    container_name: konfitur-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APPWRITE_ENDPOINT=https://${DOMAIN}/v1
      - NEXT_PUBLIC_APPWRITE_PROJECT_ID=${APPWRITE_PROJECT_ID}
      - NEXT_PUBLIC_SITE_URL=https://${DOMAIN}
      - APPWRITE_INTERNAL_ENDPOINT=http://appwrite/v1   # Appels Server Actions sans passer par l'URL publique
      - APPWRITE_API_KEY=${APPWRITE_API_KEY}
      # Secret partagé proxy.ts ↔ /api/log et /api/banned-ips. Sans lui les deux
      # routes répondent 500 (fail-secure) : plus aucun log d'audit ni ban d'IP actif.
      - LOG_INTERNAL_SECRET=${LOG_INTERNAL_SECRET}
    networks:
      - konfitur-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.middlewares=security-headers@file,rate-limit@file,compress-response@file"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      # Rate limit strict sur les pages d'authentification (issue #67)
      - "traefik.http.routers.frontend-auth.rule=(Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)) && PathPrefix(`/auth`)"
      - "traefik.http.routers.frontend-auth.entrypoints=websecure"
      - "traefik.http.routers.frontend-auth.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend-auth.middlewares=security-headers@file,auth-rate-limit@file,compress-response@file"
      - "traefik.http.routers.frontend-auth.service=frontend"
    depends_on:
      - appwrite

  # ════════════════════════════════════════
  # APPWRITE — Backend (self-hosted)
  # ════════════════════════════════════════
  appwrite:
    image: appwrite/appwrite:1.9.0
    container_name: konfitur-appwrite
    restart: unless-stopped
    volumes:
      - appwrite-uploads:/storage/uploads
      - appwrite-config:/storage/config
      - appwrite-certificates:/storage/certificates
      - appwrite-functions:/storage/functions
    environment:
      - _APP_ENV=production
      # Domaine RACINE (pas api.), sinon Appwrite pose le cookie de session sur
      # .api.${DOMAIN} : le frontend SSR sur ${DOMAIN} ne le voit pas → boucle de
      # login. La racine donne un cookie .${DOMAIN} partagé par les deux sous-domaines.
      - _APP_DOMAIN=${DOMAIN}
      - _APP_DOMAIN_TARGET=api.${DOMAIN}
      - _APP_DOMAIN_TARGET_CNAME=api.${DOMAIN}
      - _APP_DOMAIN_TARGET_A=
      - _APP_DOMAIN_TARGET_AAAA=
      - _APP_DOMAIN_FUNCTIONS=functions.${DOMAIN}
      # SSR : le frontend appelle Appwrite en http://appwrite/v1 (Host: appwrite). En 1.9 le
      # routeur rejette (401) tout Host absent de platform.hostnames, et node-appwrite 22
      # (fetch natif) ne peut PAS forcer le Host (header interdit). _APP_OPTIONS_ROUTER_PROTECTION
      # est vestigial (non lu) ; seul _APP_MIGRATION_HOST réinjecte un hostname dans la liste.
      # Appwrite n'est joignable de l'extérieur que via Traefik (filtre déjà le Host) → sûr.
      - _APP_MIGRATION_HOST=appwrite
      - _APP_CONSOLE_WHITELIST_ROOT=enabled
      - _APP_CONSOLE_WHITELIST_EMAILS=${ADMIN_EMAIL}
      - _APP_OPENSSL_KEY_V1=${APPWRITE_OPENSSL_KEY}
      - _APP_DB_ADAPTER=mariadb
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=appwrite
      - _APP_DB_PASS=${MARIADB_PASSWORD}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      # Collecte des statistiques d'usage. Sans cette variable, les workers
      # stats-usage / stats-resources tournent à vide et la console n'affiche
      # aucune métrique (requêtes, stockage, exécutions).
      - _APP_USAGE_STATS=enabled
      - _APP_STORAGE_LIMIT=160000000      # 160 Mo max par fichier (bucket builds à 150 Mo)
      - _APP_STORAGE_ANTIVIRUS=enabled
      - _APP_STORAGE_ANTIVIRUS_HOST=clamav
      - _APP_STORAGE_ANTIVIRUS_PORT=3310
      - _APP_STORAGE_PREVIEW_LIMIT=5000000  # 5 MB max pour la génération de miniatures
      - _APP_FUNCTIONS_RUNTIMES=node-20.0   # Limite aux seuls runtimes utilisés (économise le disque)
      - _APP_EXECUTOR_SECRET=${APPWRITE_EXECUTOR_SECRET}
      - _APP_COMPUTE_RUNTIMES_NETWORK=konfiturgamefullinfra_runtimes
      # Rétention automatique — évite que la DB grossisse indéfiniment
      - _APP_MAINTENANCE_RETENTION_EXECUTION=604800   # logs fonctions : 7 jours
      - _APP_MAINTENANCE_RETENTION_AUDIT=604800        # audit logs : 7 jours
      - _APP_MAINTENANCE_RETENTION_ABUSE=86400         # abuse logs : 1 jour
      - _APP_MAINTENANCE_RETENTION_CACHE=604800        # cache fichiers : 7 jours
      - _APP_SMTP_HOST=${APPWRITE_APP_SMTP_HOST}
      - _APP_SMTP_PORT=${APPWRITE_APP_SMTP_PORT}
      - _APP_SMTP_SECURE=${APPWRITE_APP_SMTP_SECURE}
      - _APP_SMTP_USERNAME=${APPWRITE_APP_SMTP_USERNAME}
      - _APP_SMTP_PASSWORD=${APPWRITE_APP_SMTP_PASSWORD}
      - _APP_SYSTEM_EMAIL_ADDRESS=${APPWRITE_APP_SYSTEM_EMAIL_ADDRESS}
      - _APP_SYSTEM_EMAIL_NAME=${APPWRITE_APP_SYSTEM_EMAIL_NAME}
    networks:
      - konfitur-net
      - appwrite-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.appwrite.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.appwrite.entrypoints=websecure"
      - "traefik.http.routers.appwrite.tls.certresolver=letsencrypt"
      - "traefik.http.routers.appwrite.middlewares=security-headers@file,appwrite-rate-limit@file"
      - "traefik.http.services.appwrite.loadbalancer.server.port=80"
      # Rate limit strict sur les créations de session (login email + OAuth callback)
      - "traefik.http.routers.appwrite-auth.rule=Host(`api.${DOMAIN}`) && PathPrefix(`/v1/account/sessions`)"
      - "traefik.http.routers.appwrite-auth.entrypoints=websecure"
      - "traefik.http.routers.appwrite-auth.tls.certresolver=letsencrypt"
      - "traefik.http.routers.appwrite-auth.middlewares=security-headers@file,auth-rate-limit@file"
      - "traefik.http.routers.appwrite-auth.service=appwrite"
      # ── API aussi servie sous le domaine RACINE (konfiturgame.fr/v1) ──
      # api.${DOMAIN} reste actif en parallèle (console, CLI, CI).
      # Priorité EXPLICITE obligatoire : la priorité auto de Traefik = longueur de la règle
      - "traefik.http.routers.appwrite-app.rule=Host(`${DOMAIN}`) && PathPrefix(`/v1`)"
      - "traefik.http.routers.appwrite-app.priority=100"
      - "traefik.http.routers.appwrite-app.entrypoints=websecure"
      - "traefik.http.routers.appwrite-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.appwrite-app.middlewares=security-headers@file,appwrite-rate-limit@file"
      - "traefik.http.routers.appwrite-app.service=appwrite"
      - "traefik.http.routers.appwrite-app-auth.rule=Host(`${DOMAIN}`) && PathPrefix(`/v1/account/sessions`)"
      - "traefik.http.routers.appwrite-app-auth.priority=200"
      - "traefik.http.routers.appwrite-app-auth.entrypoints=websecure"
      - "traefik.http.routers.appwrite-app-auth.tls.certresolver=letsencrypt"
      - "traefik.http.routers.appwrite-app-auth.middlewares=security-headers@file,auth-rate-limit@file"
      - "traefik.http.routers.appwrite-app-auth.service=appwrite"
    depends_on:
      - mariadb
      - redis

  # ════════════════════════════════════════
  # APPWRITE CONSOLE — SPA admin (extraite du container API depuis 1.7+)
  # Route: https://api.${DOMAIN}/console → conteneur dédié
  # ════════════════════════════════════════
  appwrite-console:
    image: appwrite/console:7.5.7
    container_name: konfitur-appwrite-console
    restart: unless-stopped
    networks:
      - konfitur-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.appwrite-console.rule=Host(`api.${DOMAIN}`) && PathPrefix(`/console`)"
      - "traefik.http.routers.appwrite-console.entrypoints=websecure"
      - "traefik.http.routers.appwrite-console.tls.certresolver=letsencrypt"
      - "traefik.http.routers.appwrite-console.middlewares=security-headers@file"
      - "traefik.http.services.appwrite-console.loadbalancer.server.port=80"

  # ════════════════════════════════════════
  # APPWRITE WORKER — Realtime
  # ════════════════════════════════════════
  appwrite-realtime:
    image: appwrite/appwrite:1.9.0
    container_name: konfitur-appwrite-realtime
    restart: unless-stopped
    entrypoint: realtime
    environment:
      - _APP_ENV=production
      - _APP_DB_ADAPTER=mariadb
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=appwrite
      - _APP_DB_PASS=${MARIADB_PASSWORD}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_OPENSSL_KEY_V1=${APPWRITE_OPENSSL_KEY}
    networks:
      - konfitur-net
      - appwrite-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.appwrite-realtime.rule=Host(`api.${DOMAIN}`) && PathPrefix(`/v1/realtime`)"
      - "traefik.http.routers.appwrite-realtime.entrypoints=websecure"
      - "traefik.http.routers.appwrite-realtime.tls.certresolver=letsencrypt"
      - "traefik.http.services.appwrite-realtime.loadbalancer.server.port=80"
      # WebSocket chat sous le domaine racine (cible de wss://${DOMAIN} dans la CSP).
      # priority=200 : bat frontend(54) ET le /v1 générique d'appwrite-app(100).
      - "traefik.http.routers.appwrite-realtime-app.rule=Host(`${DOMAIN}`) && PathPrefix(`/v1/realtime`)"
      - "traefik.http.routers.appwrite-realtime-app.priority=200"
      - "traefik.http.routers.appwrite-realtime-app.entrypoints=websecure"
      - "traefik.http.routers.appwrite-realtime-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.appwrite-realtime-app.service=appwrite-realtime"
    depends_on:
      - mariadb
      - redis

  # ════════════════════════════════════════
  # MARIADB — Base de données Appwrite
  # ════════════════════════════════════════
  mariadb:
    image: mariadb:10.11
    container_name: konfitur-mariadb
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MYSQL_DATABASE=appwrite
      - MYSQL_USER=appwrite
      - MYSQL_PASSWORD=${MARIADB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - appwrite-net
    command: >
      --innodb-flush-method=O_DSYNC
      --innodb-use-native-aio=0
      --max-connections=250

  # ════════════════════════════════════════
  # REDIS — Cache & Realtime Appwrite
  # NOTE: pas de --requirepass car Appwrite 1.5 a un bug dans Queue\Connection\Redis
  # qui n'envoie jamais AUTH → les jobs de queue ne sont jamais publiés.
  # Redis est sur appwrite-net (réseau interne, non exposé à l'extérieur).
  # ════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: konfitur-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - appwrite-net

  # ════════════════════════════════════════
  # CLAMAV — Scan antivirus des fichiers uploadés (buckets fileSecurity)
  # ════════════════════════════════════════
  clamav:
    image: clamav/clamav:1.4
    container_name: konfitur-clamav
    restart: unless-stopped
    volumes:
      # Appwrite ne transmet qu'un chemin de fichier à clamd (pas le contenu) — clamd doit
      # donc voir le même volume que le service appwrite, au même chemin.
      - appwrite-uploads:/storage/uploads:ro
    networks:
      - appwrite-net

  # ════════════════════════════════════════
  # APPWRITE WORKER — Databases (attributs, indexes, collections)
  # Requis pour que les attributs passent de "processing" à "available"
  # ════════════════════════════════════════
  appwrite-worker-databases:
    image: appwrite/appwrite:1.9.0
    container_name: konfitur-appwrite-worker-databases
    restart: unless-stopped
    entrypoint: worker-databases
    environment:
      - _APP_ENV=production
      - _APP_OPENSSL_KEY_V1=${APPWRITE_OPENSSL_KEY}
      - _APP_DB_ADAPTER=mariadb
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=appwrite
      - _APP_DB_PASS=${MARIADB_PASSWORD}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
    networks:
      - appwrite-net
    depends_on:
      - mariadb
      - redis

  # ════════════════════════════════════════
  # APPWRITE WORKER — Mails (envoi SMTP)
  # ════════════════════════════════════════
  appwrite-worker-mails:
    image: appwrite/appwrite:1.9.0
    container_name: konfitur-appwrite-worker-mails
    restart: unless-stopped
    entrypoint: worker-mails
    environment:
      - _APP_ENV=production
      - _APP_OPENSSL_KEY_V1=${APPWRITE_OPENSSL_KEY}
      - _APP_DB_ADAPTER=mariadb
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=appwrite
      - _APP_DB_PASS=${MARIADB_PASSWORD}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_SMTP_HOST=${APPWRITE_APP_SMTP_HOST}
      - _APP_SMTP_PORT=${APPWRITE_APP_SMTP_PORT}
      - _APP_SMTP_SECURE=${APPWRITE_APP_SMTP_SECURE}
      - _APP_SMTP_USERNAME=${APPWRITE_APP_SMTP_USERNAME}
      - _APP_SMTP_PASSWORD=${APPWRITE_APP_SMTP_PASSWORD}
      - _APP_SYSTEM_EMAIL_ADDRESS=${APPWRITE_APP_SYSTEM_EMAIL_ADDRESS}
      - _APP_SYSTEM_EMAIL_NAME=${APPWRITE_APP_SYSTEM_EMAIL_NAME}
    networks:
      - appwrite-net
    depends_on:
      - mariadb
      - redis

  # ════════════════════════════════════════
  # APPWRITE WORKER — Builds (compile les deployments de functions)
  # Consomme la queue Redis de build et appelle l'executor
  # ════════════════════════════════════════
  appwrite-worker-builds:
    image: appwrite/appwrite:1.9.0
    container_name: konfitur-appwrite-worker-builds
    restart: unless-stopped
    entrypoint: worker-builds
    environment:
      - _APP_ENV=production
      - _APP_OPENSSL_KEY_V1=${APPWRITE_OPENSSL_KEY}
      - _APP_DB_ADAPTER=mariadb
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=appwrite
      - _APP_DB_PASS=${MARIADB_PASSWORD}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_EXECUTOR_HOST=http://exc1/v1
      - _APP_EXECUTOR_SECRET=${APPWRITE_EXECUTOR_SECRET}
      - _APP_FUNCTIONS_RUNTIMES=node-20.0
      - _APP_STORAGE_DEVICE=local
    networks:
      - appwrite-net
    depends_on:
      - mariadb
      - redis

  # ════════════════════════════════════════
  # APPWRITE WORKER — Functions (exécute les functions : cron, triggers, API)
  # ════════════════════════════════════════
  appwrite-worker-functions:
    image: appwrite/appwrite:1.9.0
    container_name: konfitur-appwrite-worker-functions
    restart: unless-stopped
    entrypoint: worker-functions
    environment:
      - _APP_ENV=production
      - _APP_OPENSSL_KEY_V1=${APPWRITE_OPENSSL_KEY}
      - _APP_DB_ADAPTER=mariadb
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=appwrite
      - _APP_DB_PASS=${MARIADB_PASSWORD}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_EXECUTOR_HOST=http://exc1/v1
      - _APP_EXECUTOR_SECRET=${APPWRITE_EXECUTOR_SECRET}
      - _APP_FUNCTIONS_RUNTIMES=node-20.0
    networks:
      - appwrite-net
    depends_on:
      - mariadb
      - redis

  # ════════════════════════════════════════
  # OPENRUNTIMES EXECUTOR — Build & run des functions
  # ════════════════════════════════════════
  appwrite-executor:
    image: openruntimes/executor:0.11.4
    container_name: openruntimes-executor
    hostname: exc1
    restart: unless-stopped
    stop_signal: SIGINT
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - appwrite-builds:/storage/builds:rw
      - appwrite-functions:/storage/functions:rw
      - /tmp:/tmp:rw
    environment:
      - OPR_EXECUTOR_IMAGE_PULL=enabled
      - OPR_EXECUTOR_NETWORK=konfiturgamefullinfra_runtimes
      - OPR_EXECUTOR_ENV=production
      - OPR_EXECUTOR_RUNTIMES=node-20.0
      - OPR_EXECUTOR_SECRET=${APPWRITE_EXECUTOR_SECRET}
      - OPR_EXECUTOR_RUNTIME_VERSIONS=v5
      - OPR_EXECUTOR_INACTIVE_TRESHOLD=60
      - OPR_EXECUTOR_MAINTENANCE_INTERVAL=3600
      - OPR_EXECUTOR_STORAGE_DEVICE=local
    networks:
      - appwrite-net
      - runtimes

  # ════════════════════════════════════════
  # APPWRITE WORKER — Stats usage
  # Consomme la queue Redis des compteurs d'usage (requêtes, exécutions,
  # stockage) et les agrège en base. Sans lui, la console Appwrite affiche
  # des métriques vides : les événements s'empilent dans Redis sans jamais
  # être écrits.
  # ════════════════════════════════════════
  appwrite-worker-stats-usage:
    image: appwrite/appwrite:1.9.0
    container_name: konfitur-appwrite-worker-stats-usage
    restart: unless-stopped
    entrypoint: worker-stats-usage
    environment:
      - _APP_ENV=production
      - _APP_USAGE_STATS=enabled
      - _APP_USAGE_AGGREGATION_INTERVAL=30
      - _APP_OPENSSL_KEY_V1=${APPWRITE_OPENSSL_KEY}
      - _APP_DB_ADAPTER=mariadb
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=appwrite
      - _APP_DB_PASS=${MARIADB_PASSWORD}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
    networks:
      - appwrite-net
    depends_on:
      - mariadb
      - redis

  # ════════════════════════════════════════
  # APPWRITE WORKER — Stats resources
  # Agrège l'inventaire des ressources du projet (nombre de documents,
  # buckets, utilisateurs, fonctions).
  # ════════════════════════════════════════
  appwrite-worker-stats-resources:
    image: appwrite/appwrite:1.9.0
    container_name: konfitur-appwrite-worker-stats-resources
    restart: unless-stopped
    entrypoint: worker-stats-resources
    environment:
      - _APP_ENV=production
      - _APP_USAGE_STATS=enabled
      - _APP_USAGE_AGGREGATION_INTERVAL=30
      - _APP_OPENSSL_KEY_V1=${APPWRITE_OPENSSL_KEY}
      - _APP_DB_ADAPTER=mariadb
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=appwrite
      - _APP_DB_PASS=${MARIADB_PASSWORD}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
    networks:
      - appwrite-net
    depends_on:
      - mariadb
      - redis

  # ════════════════════════════════════════
  # APPWRITE TASK — Stats resources (ordonnanceur)
  # Déclenche périodiquement le worker ci-dessus. C'est la tâche, pas le
  # worker, qui porte la cadence : sans elle le worker attend indéfiniment.
  # ════════════════════════════════════════
  appwrite-task-stats-resources:
    image: appwrite/appwrite:1.9.0
    container_name: konfitur-appwrite-task-stats-resources
    restart: unless-stopped
    entrypoint: stats-resources
    environment:
      - _APP_ENV=production
      - _APP_USAGE_STATS=enabled
      - _APP_STATS_RESOURCES_INTERVAL=3600   # inventaire toutes les heures
      - _APP_OPENSSL_KEY_V1=${APPWRITE_OPENSSL_KEY}
      - _APP_DB_ADAPTER=mariadb
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=appwrite
      - _APP_DB_PASS=${MARIADB_PASSWORD}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
    networks:
      - appwrite-net
    depends_on:
      - mariadb
      - redis

  # ════════════════════════════════════════
  # PROMETHEUS — Collecte et évaluation des alertes
  # Aucun port publié : la seule surface d'accès est Grafana.
  # Configuration montée en volume, donc jamais rechargée par `up -d` : c'est
  # deploy-infra qui envoie le SIGHUP de relecture (voir ci-cd.yml).
  # ════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: konfitur-prometheus
    restart: unless-stopped
    user: "nobody"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 30 jours : couvre l'analyse d'un incident et la revue mensuelle, sans
      # laisser la base grossir indéfiniment sur un disque de 100 Go.
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=4GB
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring-net
    depends_on:
      - node-exporter
      - cadvisor
      - blackbox-exporter
      - alertmanager

  # ════════════════════════════════════════
  # ALERTMANAGER — Routage et notification des alertes
  # Prometheus évalue les règles, Alertmanager décide qui prévenir, quand et
  # à quelle cadence. Sans lui, une alerte passe en `firing` sans que
  # personne ne soit notifié : Grafana n'achemine que les alertes qu'il
  # évalue lui-même, pas celles d'un Prometheus externe.
  # ════════════════════════════════════════
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: konfitur-alertmanager
    restart: unless-stopped
    # Alertmanager n'interpole aucune variable d'environnement dans sa
    # configuration. Le webhook est donc déposé au démarrage dans un fichier
    # que la config lit via `webhook_url_file` : le secret reste dans .env,
    # source unique, et n'est jamais versionné. umask 077 pour que le fichier
    # ne soit lisible que par le processus.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        mkdir -p /tmp/secrets
        printf '%s' "$${DISCORD_ALERT_WEBHOOK}" > /tmp/secrets/discord_webhook
        exec /bin/alertmanager \
          --config.file=/etc/alertmanager/alertmanager.yml \
          --storage.path=/alertmanager
    environment:
      - DISCORD_ALERT_WEBHOOK=${DISCORD_ALERT_WEBHOOK}
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    networks:
      - monitoring-net

  # ════════════════════════════════════════
  # GRAFANA — Visualisation
  # Seul composant de la supervision exposé, derrière TLS et son propre
  # écran de connexion. La notification est portée par Alertmanager.
  # ════════════════════════════════════════
  grafana:
    image: grafana/grafana:11.5.1
    container_name: konfitur-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      # Inscription libre désactivée et mode anonyme coupé : les tableaux de
      # bord révèlent la topologie et les volumes d'usage de la plateforme.
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - konfitur-net      # pour être exposé par Traefik
      - monitoring-net    # pour interroger Prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.routers.grafana.middlewares=grafana-headers@file,rate-limit@file"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    depends_on:
      - prometheus

  # ════════════════════════════════════════
  # NODE EXPORTER — Métriques de l'hôte (CPU, RAM, disque)
  # Monte la racine en lecture seule pour mesurer le disque réel de l'hôte
  # et non celui, virtuel, du conteneur.
  # ════════════════════════════════════════
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: konfitur-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      # Collecteur de fichiers : scripts/backup.sh y dépose ses métriques.
      # C'est le pont entre les tâches shell et la supervision.
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
      - ./monitoring/textfile:/var/lib/node_exporter/textfile_collector:ro
    networks:
      - monitoring-net

  # ════════════════════════════════════════
  # CADVISOR — Métriques par conteneur
  # Attribue une consommation à un service précis, là où node-exporter ne
  # donne que le total de la machine.
  # ════════════════════════════════════════
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: konfitur-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring-net

  # ════════════════════════════════════════
  # BLACKBOX EXPORTER — Sondes HTTP externes
  # Interroge les URL publiques depuis l'extérieur de l'application : mesure
  # la disponibilité telle qu'un visiteur la perçoit, TLS et routage Traefik
  # compris, là où les autres sondes ne voient que l'intérieur.
  # ════════════════════════════════════════
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: konfitur-blackbox-exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./monitoring/blackbox:/etc/blackbox:ro
    networks:
      - monitoring-net

