networks:
  konfitur-net:
    driver: bridge
  appwrite-net:
    driver: bridge
  runtimes:
    driver: bridge

volumes:
  appwrite-uploads:
  appwrite-config:
  appwrite-certificates:
  appwrite-functions:
  appwrite-builds:
  traefik-acme:
  redis-data:
  mariadb-data:

services:
  # ════════════════════════════════════════
  # TRAEFIK — Reverse Proxy + TLS
  # ════════════════════════════════════════
  traefik:
    image: traefik:v3.6.7
    container_name: konfitur-traefik
    restart: unless-stopped
    environment:
      - ADMIN_EMAIL=${ADMIN_EMAIL}   # Requis par traefik.yml pour ACME/Let's Encrypt
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-acme:/etc/traefik/acme
    networks:
      - konfitur-net
      - appwrite-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=auth-dashboard,security-headers"

  # ════════════════════════════════════════
  # FRONTEND — Next.js
  # ════════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APPWRITE_ENDPOINT: https://api.${DOMAIN}/v1
        NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID}
    container_name: konfitur-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APPWRITE_ENDPOINT=https://api.${DOMAIN}/v1
      - NEXT_PUBLIC_APPWRITE_PROJECT_ID=${APPWRITE_PROJECT_ID}
      - NEXT_PUBLIC_SITE_URL=https://${DOMAIN}
      - APPWRITE_INTERNAL_ENDPOINT=http://appwrite/v1   # Appels Server Actions sans passer par l'URL publique
      - APPWRITE_API_KEY=${APPWRITE_API_KEY}
    networks:
      - konfitur-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.middlewares=security-headers,rate-limit,compress-response"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    depends_on:
      - appwrite

  # ════════════════════════════════════════
  # APPWRITE — Backend (self-hosted)
  # ════════════════════════════════════════
  appwrite:
    image: appwrite/appwrite:1.9.0
    container_name: konfitur-appwrite
    restart: unless-stopped
    volumes:
      - appwrite-uploads:/storage/uploads
      - appwrite-config:/storage/config
      - appwrite-certificates:/storage/certificates
      - appwrite-functions:/storage/functions
    environment:
      - _APP_ENV=production
      - _APP_DOMAIN=api.${DOMAIN}
      - _APP_DOMAIN_TARGET=api.${DOMAIN}
      - _APP_DOMAIN_TARGET_CNAME=api.${DOMAIN}
      - _APP_DOMAIN_TARGET_A=
      - _APP_DOMAIN_TARGET_AAAA=
      - _APP_DOMAIN_FUNCTIONS=functions.${DOMAIN}
      # SSR : le frontend appelle Appwrite en http://appwrite/v1 (Host: appwrite). En 1.9 le
      # routeur rejette (401) tout Host absent de platform.hostnames, et node-appwrite 22
      # (fetch natif) ne peut PAS forcer le Host (header interdit). _APP_OPTIONS_ROUTER_PROTECTION
      # est vestigial (non lu) ; seul _APP_MIGRATION_HOST réinjecte un hostname dans la liste.
      # Appwrite n'est joignable de l'extérieur que via Traefik (filtre déjà le Host) → sûr.
      - _APP_MIGRATION_HOST=appwrite
      - _APP_CONSOLE_WHITELIST_ROOT=enabled
      - _APP_CONSOLE_WHITELIST_EMAILS=${ADMIN_EMAIL}
      - _APP_OPENSSL_KEY_V1=${APPWRITE_OPENSSL_KEY}
      - _APP_DB_ADAPTER=mariadb
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=appwrite
      - _APP_DB_PASS=${MARIADB_PASSWORD}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_STORAGE_LIMIT=160000000      # 160 Mo max par fichier (bucket builds à 150 Mo)
      - _APP_STORAGE_ANTIVIRUS=enabled
      - _APP_STORAGE_ANTIVIRUS_HOST=clamav
      - _APP_STORAGE_ANTIVIRUS_PORT=3310
      - _APP_STORAGE_PREVIEW_LIMIT=5000000  # 5 MB max pour la génération de miniatures
      - _APP_FUNCTIONS_RUNTIMES=node-20.0   # Limite aux seuls runtimes utilisés (économise le disque)
      - _APP_EXECUTOR_SECRET=${APPWRITE_EXECUTOR_SECRET}
      - _APP_COMPUTE_RUNTIMES_NETWORK=konfiturgamefullinfra_runtimes
      # Rétention automatique — évite que la DB grossisse indéfiniment
      - _APP_MAINTENANCE_RETENTION_EXECUTION=604800   # logs fonctions : 7 jours
      - _APP_MAINTENANCE_RETENTION_AUDIT=604800        # audit logs : 7 jours
      - _APP_MAINTENANCE_RETENTION_ABUSE=86400         # abuse logs : 1 jour
      - _APP_MAINTENANCE_RETENTION_CACHE=604800        # cache fichiers : 7 jours
      - _APP_SMTP_HOST=${APPWRITE_APP_SMTP_HOST}
      - _APP_SMTP_PORT=${APPWRITE_APP_SMTP_PORT}
      - _APP_SMTP_SECURE=${APPWRITE_APP_SMTP_SECURE}
      - _APP_SMTP_USERNAME=${APPWRITE_APP_SMTP_USERNAME}
      - _APP_SMTP_PASSWORD=${APPWRITE_APP_SMTP_PASSWORD}
      - _APP_SYSTEM_EMAIL_ADDRESS=${APPWRITE_APP_SYSTEM_EMAIL_ADDRESS}
      - _APP_SYSTEM_EMAIL_NAME=${APPWRITE_APP_SYSTEM_EMAIL_NAME}
    networks:
      - konfitur-net
      - appwrite-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.appwrite.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.appwrite.entrypoints=websecure"
      - "traefik.http.routers.appwrite.tls.certresolver=letsencrypt"
      - "traefik.http.routers.appwrite.middlewares=security-headers,appwrite-rate-limit"
      - "traefik.http.services.appwrite.loadbalancer.server.port=80"
    depends_on:
      - mariadb
      - redis

  # ════════════════════════════════════════
  # APPWRITE CONSOLE — SPA admin (extraite du container API depuis 1.7+)
  # Route: https://api.${DOMAIN}/console → conteneur dédié
  # ════════════════════════════════════════
  appwrite-console:
    image: appwrite/console:7.5.7
    container_name: konfitur-appwrite-console
    restart: unless-stopped
    networks:
      - konfitur-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.appwrite-console.rule=Host(`api.${DOMAIN}`) && PathPrefix(`/console`)"
      - "traefik.http.routers.appwrite-console.entrypoints=websecure"
      - "traefik.http.routers.appwrite-console.tls.certresolver=letsencrypt"
      - "traefik.http.routers.appwrite-console.middlewares=security-headers"
      - "traefik.http.services.appwrite-console.loadbalancer.server.port=80"

  # ════════════════════════════════════════
  # APPWRITE WORKER — Realtime
  # ════════════════════════════════════════
  appwrite-realtime:
    image: appwrite/appwrite:1.9.0
    container_name: konfitur-appwrite-realtime
    restart: unless-stopped
    entrypoint: realtime
    environment:
      - _APP_ENV=production
      - _APP_DB_ADAPTER=mariadb
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=appwrite
      - _APP_DB_PASS=${MARIADB_PASSWORD}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_OPENSSL_KEY_V1=${APPWRITE_OPENSSL_KEY}
    networks:
      - konfitur-net
      - appwrite-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.appwrite-realtime.rule=Host(`api.${DOMAIN}`) && PathPrefix(`/v1/realtime`)"
      - "traefik.http.routers.appwrite-realtime.entrypoints=websecure"
      - "traefik.http.routers.appwrite-realtime.tls.certresolver=letsencrypt"
      - "traefik.http.services.appwrite-realtime.loadbalancer.server.port=80"
    depends_on:
      - mariadb
      - redis

  # ════════════════════════════════════════
  # MARIADB — Base de données Appwrite
  # ════════════════════════════════════════
  mariadb:
    image: mariadb:10.11
    container_name: konfitur-mariadb
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MYSQL_DATABASE=appwrite
      - MYSQL_USER=appwrite
      - MYSQL_PASSWORD=${MARIADB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - appwrite-net
    command: >
      --innodb-flush-method=O_DSYNC
      --innodb-use-native-aio=0
      --max-connections=250

  # ════════════════════════════════════════
  # REDIS — Cache & Realtime Appwrite
  # NOTE: pas de --requirepass car Appwrite 1.5 a un bug dans Queue\Connection\Redis
  # qui n'envoie jamais AUTH → les jobs de queue ne sont jamais publiés.
  # Redis est sur appwrite-net (réseau interne, non exposé à l'extérieur).
  # ════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: konfitur-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - appwrite-net

  # ════════════════════════════════════════
  # CLAMAV — Scan antivirus des fichiers uploadés (buckets fileSecurity)
  # ════════════════════════════════════════
  clamav:
    image: clamav/clamav:1.4
    container_name: konfitur-clamav
    restart: unless-stopped
    volumes:
      # Appwrite ne transmet qu'un chemin de fichier à clamd (pas le contenu) — clamd doit
      # donc voir le même volume que le service appwrite, au même chemin.
      - appwrite-uploads:/storage/uploads:ro
    networks:
      - appwrite-net

  # ════════════════════════════════════════
  # APPWRITE WORKER — Databases (attributs, indexes, collections)
  # Requis pour que les attributs passent de "processing" à "available"
  # ════════════════════════════════════════
  appwrite-worker-databases:
    image: appwrite/appwrite:1.9.0
    container_name: konfitur-appwrite-worker-databases
    restart: unless-stopped
    entrypoint: worker-databases
    environment:
      - _APP_ENV=production
      - _APP_OPENSSL_KEY_V1=${APPWRITE_OPENSSL_KEY}
      - _APP_DB_ADAPTER=mariadb
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=appwrite
      - _APP_DB_PASS=${MARIADB_PASSWORD}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
    networks:
      - appwrite-net
    depends_on:
      - mariadb
      - redis

  # ════════════════════════════════════════
  # APPWRITE WORKER — Mails (envoi SMTP)
  # ════════════════════════════════════════
  appwrite-worker-mails:
    image: appwrite/appwrite:1.9.0
    container_name: konfitur-appwrite-worker-mails
    restart: unless-stopped
    entrypoint: worker-mails
    environment:
      - _APP_ENV=production
      - _APP_OPENSSL_KEY_V1=${APPWRITE_OPENSSL_KEY}
      - _APP_DB_ADAPTER=mariadb
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=appwrite
      - _APP_DB_PASS=${MARIADB_PASSWORD}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_SMTP_HOST=${APPWRITE_APP_SMTP_HOST}
      - _APP_SMTP_PORT=${APPWRITE_APP_SMTP_PORT}
      - _APP_SMTP_SECURE=${APPWRITE_APP_SMTP_SECURE}
      - _APP_SMTP_USERNAME=${APPWRITE_APP_SMTP_USERNAME}
      - _APP_SMTP_PASSWORD=${APPWRITE_APP_SMTP_PASSWORD}
      - _APP_SYSTEM_EMAIL_ADDRESS=${APPWRITE_APP_SYSTEM_EMAIL_ADDRESS}
      - _APP_SYSTEM_EMAIL_NAME=${APPWRITE_APP_SYSTEM_EMAIL_NAME}
    networks:
      - appwrite-net
    depends_on:
      - mariadb
      - redis

  # ════════════════════════════════════════
  # APPWRITE WORKER — Builds (compile les deployments de functions)
  # Consomme la queue Redis de build et appelle l'executor
  # ════════════════════════════════════════
  appwrite-worker-builds:
    image: appwrite/appwrite:1.9.0
    container_name: konfitur-appwrite-worker-builds
    restart: unless-stopped
    entrypoint: worker-builds
    environment:
      - _APP_ENV=production
      - _APP_OPENSSL_KEY_V1=${APPWRITE_OPENSSL_KEY}
      - _APP_DB_ADAPTER=mariadb
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=appwrite
      - _APP_DB_PASS=${MARIADB_PASSWORD}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_EXECUTOR_HOST=http://exc1/v1
      - _APP_EXECUTOR_SECRET=${APPWRITE_EXECUTOR_SECRET}
      - _APP_FUNCTIONS_RUNTIMES=node-20.0
      - _APP_STORAGE_DEVICE=local
    networks:
      - appwrite-net
    depends_on:
      - mariadb
      - redis

  # ════════════════════════════════════════
  # APPWRITE WORKER — Functions (exécute les functions : cron, triggers, API)
  # ════════════════════════════════════════
  appwrite-worker-functions:
    image: appwrite/appwrite:1.9.0
    container_name: konfitur-appwrite-worker-functions
    restart: unless-stopped
    entrypoint: worker-functions
    environment:
      - _APP_ENV=production
      - _APP_OPENSSL_KEY_V1=${APPWRITE_OPENSSL_KEY}
      - _APP_DB_ADAPTER=mariadb
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=appwrite
      - _APP_DB_PASS=${MARIADB_PASSWORD}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_EXECUTOR_HOST=http://exc1/v1
      - _APP_EXECUTOR_SECRET=${APPWRITE_EXECUTOR_SECRET}
      - _APP_FUNCTIONS_RUNTIMES=node-20.0
    networks:
      - appwrite-net
    depends_on:
      - mariadb
      - redis

  # ════════════════════════════════════════
  # OPENRUNTIMES EXECUTOR — Build & run des functions
  # ════════════════════════════════════════
  appwrite-executor:
    image: openruntimes/executor:0.11.4
    container_name: openruntimes-executor
    hostname: exc1
    restart: unless-stopped
    stop_signal: SIGINT
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - appwrite-builds:/storage/builds:rw
      - appwrite-functions:/storage/functions:rw
      - /tmp:/tmp:rw
    environment:
      - OPR_EXECUTOR_IMAGE_PULL=enabled
      - OPR_EXECUTOR_NETWORK=konfiturgamefullinfra_runtimes
      - OPR_EXECUTOR_ENV=production
      - OPR_EXECUTOR_RUNTIMES=node-20.0
      - OPR_EXECUTOR_SECRET=${APPWRITE_EXECUTOR_SECRET}
      - OPR_EXECUTOR_RUNTIME_VERSIONS=v5
      - OPR_EXECUTOR_INACTIVE_TRESHOLD=60
      - OPR_EXECUTOR_MAINTENANCE_INTERVAL=3600
      - OPR_EXECUTOR_STORAGE_DEVICE=local
    networks:
      - appwrite-net
      - runtimes

