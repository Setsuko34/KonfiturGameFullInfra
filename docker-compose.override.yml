# Overrides pour l'environnement de développement local
# Usage : docker compose up (utilise automatiquement ce fichier)

services:
  # ────────────────────────────────────────────────────────
  # TRAEFIK — Config dev isolée (pas de TLS, pas d'ACME)
  # ────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.6.7

    # --configFile remplace ENTIÈREMENT /etc/traefik/traefik.yml
    command:
      - "--configFile=/etc/traefik/traefik.dev.yml"
    volumes:
      - ./traefik/traefik.dev.yml:/etc/traefik/traefik.dev.yml:ro
    ports:
      - "80:80"
      - "8080:80"
      - "8081:8080"   # Dashboard Traefik → http://localhost:8081/dashboard/
    labels:
      - "traefik.enable=false"   # Désactive les labels prod du dashboard

  # ────────────────────────────────────────────────────────
  # FRONTEND — Next.js en mode dev avec hot-reload
  # ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
      # URL publique : port 80 obligatoire pour OAuth.
      # Appwrite 1.8 construit le redirect_uri OAuth à partir du Host header entrant.
      # Si on passe par :8080, Google/Discord reçoivent un callback :8080 non enregistré.
      - NEXT_PUBLIC_APPWRITE_ENDPOINT=http://localhost/v1
      - NEXT_PUBLIC_APPWRITE_PROJECT_ID=${APPWRITE_PROJECT_ID}
      # URL interne : résolue depuis le container frontend (Server Actions)
      - APPWRITE_INTERNAL_ENDPOINT=http://appwrite/v1
      - APPWRITE_API_KEY=${APPWRITE_API_KEY}
      - LOG_INTERNAL_SECRET=${LOG_INTERNAL_SECRET}
    ports:
      - "3000:3000"
    labels:
      - "traefik.enable=false"

  # ────────────────────────────────────────────────────────
  # APPWRITE — Accessible directement sur localhost:8080
  # networks déclaré explicitement : Docker Compose n'hérite
  # pas toujours les réseaux du fichier de base selon la version
  # → sans ça, appwrite atterrit sur le bridge par défaut et
  #   ne peut pas résoudre redis/mariadb par leur nom de service
  # ────────────────────────────────────────────────────────
  appwrite:
    image: appwrite/appwrite:1.8.0
    networks:
      - konfitur-net
      - appwrite-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.appwrite-dev.rule=Host(`localhost`)"
      - "traefik.http.routers.appwrite-dev.entrypoints=web"
      - "traefik.http.routers.appwrite-dev.service=appwrite-dev"
      - "traefik.http.services.appwrite-dev.loadbalancer.server.port=80"
      - "traefik.docker.network=konfitur-net"
    # Pas de port direct : Traefik route localhost:8080 → appwrite (sauf /console → appwrite-console)
    environment:
      # Appwrite v1.5+ stripe le port de _APP_DOMAIN → hostname sans port obligatoire.
      # Traefik route Host(`localhost`) → appwrite:80, donc le callback OAuth
      # généré sera http://localhost/v1/... (port 80 implicite, accepté par Google/Discord).
      _APP_DOMAIN: localhost
      _APP_DOMAIN_TARGET: localhost
      _APP_DOMAIN_TARGET_CNAME: localhost
      _APP_DOMAIN_TARGET_A: ""
      _APP_DOMAIN_TARGET_AAAA: ""
      # Bug Appwrite 1.8 : si _APP_DOMAIN_SITES ou _APP_DOMAIN_FUNCTIONS est vide,
      # str_ends_with($host, '') retourne true en PHP → RULE_NOT_FOUND sur toute requête /v1/.
      # Fix : fournir des valeurs non-vides qui ne matchent pas "localhost".
      _APP_DOMAIN_FUNCTIONS: functions.localhost
      _APP_DOMAIN_SITES: sites.localhost
      # OAuth dev : Appwrite 1.8 force https:// + ajoute :80 par défaut
      # → Google/Discord reçoivent https://localhost:80/... (redirect_uri_mismatch).
      # On désactive le force HTTPS pour que le scheme reste http:// en dev.
      _APP_OPTIONS_FORCE_HTTPS: disabled

  # ────────────────────────────────────────────────────────
  # APPWRITE CONSOLE — SPA admin (container séparé depuis 1.7+)
  # Route: http://localhost:8080/console → appwrite-console
  # La règle PathPrefix(/console) est plus spécifique que Host(localhost)
  # donc Traefik lui donne priorité automatiquement.
  # ────────────────────────────────────────────────────────
  appwrite-console:
    image: appwrite/console:7.5.7
    container_name: konfitur-appwrite-console
    restart: unless-stopped
    networks:
      - konfitur-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.appwrite-console-dev.rule=Host(`localhost`) && PathPrefix(`/console`)"
      - "traefik.http.routers.appwrite-console-dev.entrypoints=web"
      - "traefik.http.routers.appwrite-console-dev.service=appwrite-console-dev"
      - "traefik.http.services.appwrite-console-dev.loadbalancer.server.port=80"
      - "traefik.docker.network=konfitur-net"

  # ────────────────────────────────────────────────────────
  # APPWRITE REALTIME — Routé via Traefik en dev
  # En 1.8, realtime est un container séparé (entrypoint: realtime).
  # Le SDK dérive ws://localhost/v1/realtime depuis NEXT_PUBLIC_APPWRITE_ENDPOINT.
  # La règle PathPrefix(/v1/realtime) est plus spécifique que Host(localhost) seul
  # → Traefik lui donne priorité sur le router appwrite-dev général.
  # ────────────────────────────────────────────────────────
  appwrite-realtime:
    image: appwrite/appwrite:1.8.0
    networks:
      - konfitur-net
      - appwrite-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.appwrite-realtime-dev.rule=Host(`localhost`) && PathPrefix(`/v1/realtime`)"
      - "traefik.http.routers.appwrite-realtime-dev.entrypoints=web"
      - "traefik.http.routers.appwrite-realtime-dev.service=appwrite-realtime-dev"
      - "traefik.http.services.appwrite-realtime-dev.loadbalancer.server.port=80"
      - "traefik.docker.network=konfitur-net"
    environment:
      _APP_OPTIONS_FORCE_HTTPS: disabled
      _APP_DOMAIN: localhost
      _APP_DOMAIN_FUNCTIONS: functions.localhost
      _APP_DOMAIN_SITES: sites.localhost

  mariadb:
    ports:
      - "3306:3306"
# Référence les réseaux définis dans docker-compose.yml pour que
# Docker Compose les reconnaisse comme appartenant au même projet
networks:
  konfitur-net:
  appwrite-net:
