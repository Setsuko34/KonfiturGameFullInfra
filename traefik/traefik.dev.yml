# Config Traefik — environnement de développement local
# PAS de TLS, PAS d'ACME, dashboard en accès libre sur :8081
# Ce fichier est monté via docker-compose.override.yml

api:
  dashboard: true
  insecure: true      # Dashboard accessible sans auth sur http://localhost:8081/dashboard/

entryPoints:
  web:
    address: ":80"    # Pas de redirection HTTPS en dev
  # Même entrypoint de métriques qu'en production. Sans lui, la cible `traefik`
  # de Prometheus serait toujours down en local et la supervision ne pourrait
  # pas être validée avant la mise en production.
  metrics:
    address: ":8082"

providers:
  docker:
    exposedByDefault: false
    network: konfitur-net
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: DEBUG        # Verbose en dev pour diagnostiquer facilement

accessLog: {}         # Log tous les accès en dev

# Identique à la production : c'est ce qui permet de vérifier en local que les
# requêtes sont bien comptées par code et par routeur avant de déployer.
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
