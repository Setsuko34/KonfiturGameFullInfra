http:
  middlewares:
    security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "SAMEORIGIN"
        referrerPolicy: "strict-origin-when-cross-origin"
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=()"
        # TODO PROD: remplacer api.localhost par le vrai domaine API (ex: https://api.konfiturgame.fr)
        # Traefik file provider ne substitue pas les variables d'env — modification manuelle requise
        contentSecurityPolicy: >
          default-src 'self';
          script-src 'self' 'unsafe-inline' 'unsafe-eval';
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' https://fonts.gstatic.com;
          img-src 'self' data: https://images.unsplash.com https://cloud.appwrite.io https://api.localhost;
          connect-src 'self' https://api.localhost wss://api.localhost;
          frame-ancestors 'none';

    rate-limit:
      rateLimit:
        average: 100
        burst: 200
        period: 1m

    appwrite-rate-limit:
      rateLimit:
        average: 50
        burst: 100
        period: 1m

    compress-response:
      compress: {}

    auth-dashboard:
      basicAuth:
        users:
          - "admin:$2y$05$RdUYG6fvB2EI8Oiz9Q4r2.JXOzPhBxz.fFbBSmdNY3F1ImeGyx5Si"
