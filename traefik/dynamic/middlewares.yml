http:
  middlewares:
    security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "SAMEORIGIN"
        referrerPolicy: "strict-origin-when-cross-origin"
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=()"
        # Domaine de prod en dur : le file provider ne substitue pas les variables
        # d'env. Sans impact en dev, où aucun router n'applique ce middleware.
        contentSecurityPolicy: >
          default-src 'self';
          script-src 'self' 'unsafe-inline' 'unsafe-eval';
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' https://fonts.gstatic.com;
          img-src 'self' data: https://images.unsplash.com https://cloud.appwrite.io https://konfiturgame.fr;
          connect-src 'self' https://konfiturgame.fr wss://konfiturgame.fr;
          frame-ancestors 'none';

    rate-limit:
      rateLimit:
        average: 100
        burst: 200
        period: 1m

    appwrite-rate-limit:
      rateLimit:
        average: 50
        burst: 100
        period: 1m

    # Anti brute-force login (issue #67) : limite stricte par IP sur les
    # surfaces d'authentification. 10 tentatives/min, tolérance rafale 20.
    auth-rate-limit:
      rateLimit:
        average: 10
        burst: 20
        period: 1m

    compress-response:
      compress: {}

    # Identifiants dans un fichier htpasswd non versionné, monté par le compose.
    # Générer : htpasswd -nB admin > traefik/dashboard-users
    auth-dashboard:
      basicAuth:
        usersFile: "/etc/traefik/dashboard-users"

    # En-têtes pour Grafana. Middleware distinct de security-headers car la CSP
    # de l'application n'y convient pas : Grafana charge ses panneaux via des
    # workers et des blobs, et une CSP `default-src 'self'` seule affiche une
    # interface vide sans la moindre erreur serveur.
    # L'authentification est assurée par Grafana lui-même (pas de basicAuth
    # devant : elle casserait le webhook d'alerte et l'API).
    grafana-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "SAMEORIGIN"
        referrerPolicy: "strict-origin-when-cross-origin"
        contentSecurityPolicy: >
          default-src 'self';
          script-src 'self' 'unsafe-inline' 'unsafe-eval';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: blob:;
          font-src 'self' data:;
          connect-src 'self';
          worker-src 'self' blob:;
          frame-ancestors 'self';
