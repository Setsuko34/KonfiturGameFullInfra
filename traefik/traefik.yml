api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
  # Entrypoint dédié aux métriques Prometheus. Le port n'est PAS publié dans
  # docker-compose.yml : il n'est joignable que depuis monitoring-net. Exposer
  # ces métriques révélerait la topologie complète du routage.
  metrics:
    address: ":8082"

certificatesResolvers:
  letsencrypt:
    acme:
      email: "admin@konfiturgame.fr"
      storage: /etc/traefik/acme/acme.json
      httpChallenge:
        entryPoint: web

providers:
  docker:
    exposedByDefault: false
    network: konfitur-net
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: WARN

accessLog:
  filePath: /dev/stdout
  filters:
    statusCodes:
      - "400-599"

# Métriques exposées à Prometheus sur l'entrypoint `metrics`.
# addRoutersLabels distingue le trafic du frontend, de l'API et des surfaces
# d'authentification au sein des mêmes séries temporelles.
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
