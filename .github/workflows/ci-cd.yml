name: CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ──────────────── Étage 1 : contrôles ────────────────

  quality:
    name: Lint + type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      # Relit la config de prod, que rien n'exerce en local (le dev contourne
      # Traefik pour le frontend et n'applique aucun middleware).
      - name: Cohérence de la config de production
        working-directory: .
        run: bash scripts/ci/prod-config-check.sh .

      # backup.sh et health-check.sh tournent en root, par cron, sans personne
      # devant l'écran ; restore.sh ne s'exécute qu'un jour de crise, quand il
      # est trop tard pour le déboguer. Une expansion non quotée qui casse sur
      # un chemin à espaces ne se découvrirait que dans le journal.
      #
      # Périmètre volontairement restreint aux scripts d'exploitation et de CI.
      # Les scripts de développement (seed-*, clean-*, update-schema-*) sont
      # hors liste : deux d'entre eux ont des fins de ligne CRLF héritées du FS
      # Windows, soit 470 SC1017 qui noieraient tout le reste. Contrepartie
      # assumée : un nouveau script d'exploitation doit être ajouté ici à la
      # main. Élargir le périmètre suppose d'abord un passage dos2unix et un
      # .gitattributes.
      - name: Shellcheck des scripts d'exploitation
        working-directory: .
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck-alpine:v0.10.0 \
            shellcheck --severity=warning \
              scripts/backup.sh \
              scripts/deploy-cron.sh \
              scripts/deploy-frontend.sh \
              scripts/health-check.sh \
              scripts/restore.sh \
              scripts/ci/*.sh

  tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: frontend/coverage/
          retention-days: 7

  secrets:
    name: Scan secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action liste les commits de la PR via l'API GitHub
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rgpd:
    name: Checklist RGPD
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/rgpd-check.sh

  monitoring:
    name: Config supervision (promtool / amtool)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Les versions sont LUES dans docker-compose.yml plutôt qu'écrites ici :
      # valider les règles avec un promtool d'une autre version que le
      # Prometheus qui tourne en production ne prouve rien, et deux versions
      # épinglées à deux endroits finissent toujours par diverger.
      - name: Versions alignées sur la production
        id: versions
        run: |
          PROM=$(sed -n 's|.*image: \(prom/prometheus:v[0-9.]*\).*|\1|p' docker-compose.yml | head -1)
          AM=$(sed -n 's|.*image: \(prom/alertmanager:v[0-9.]*\).*|\1|p' docker-compose.yml | head -1)
          [ -n "$PROM" ] && [ -n "$AM" ] || { echo "Images introuvables dans docker-compose.yml"; exit 1; }
          echo "prometheus=$PROM" >> "$GITHUB_OUTPUT"
          echo "alertmanager=$AM" >> "$GITHUB_OUTPUT"
          echo "Prometheus : $PROM — Alertmanager : $AM"

      # Le montage sur /etc/prometheus n'est pas cosmétique : `rule_files:`
      # référence un chemin absolu (/etc/prometheus/alerts.yml), tel qu'il
      # existe dans le conteneur. Sans ce montage, promtool ne trouve pas le
      # fichier de règles et valide une configuration amputée.
      - name: Syntaxe des configurations Prometheus (prod + dev)
        run: |
          for cfg in prometheus.yml prometheus.dev.yml; do
            docker run --rm --entrypoint promtool \
              -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
              "${{ steps.versions.outputs.prometheus }}" \
              check config "/etc/prometheus/$cfg"
          done

      # Une erreur de syntaxe dans alerts.yml n'empêche pas Prometheus de
      # démarrer : il collecte normalement et n'évalue plus rien. La
      # supervision échoue alors en silence et en vert. C'est le seul endroit
      # où ce mode de panne est attrapé avant la production.
      - name: Tests unitaires des règles d'alerte
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            "${{ steps.versions.outputs.prometheus }}" \
            test rules /etc/prometheus/alerts.test.yml

      - name: Syntaxe de la configuration Alertmanager
        run: |
          docker run --rm --entrypoint amtool \
            -v "$PWD/monitoring/alertmanager:/etc/alertmanager:ro" \
            "${{ steps.versions.outputs.alertmanager }}" \
            check-config /etc/alertmanager/alertmanager.yml

  sast:
    name: Semgrep OWASP (non bloquant)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Scan Semgrep
        run: >-
          semgrep scan
          --config p/owasp-top-ten
          --config p/typescript
          --config p/react
          --json-output=semgrep.json
          --error
          frontend/src
      - name: Résumé
        if: always()
        run: |
          COUNT=$(python3 -c "import json; print(len(json.load(open('semgrep.json'))['results']))" 2>/dev/null || echo "?")
          echo "### Semgrep : ${COUNT} finding(s)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-sast
          path: semgrep.json
          retention-days: 7

  deps:
    name: Audit dépendances (non bloquant)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      # pnpm 11 exige node >= 22.13 — ne pas dépendre du node par défaut du runner
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pnpm audit
        run: pnpm -C frontend audit --prod --json > pnpm-audit.json || true
      - name: Trivy fs (CVE dépendances)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend
          format: json
          output: trivy-fs.json
          severity: HIGH,CRITICAL
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-deps
          path: |
            pnpm-audit.json
            trivy-fs.json
          retention-days: 7
      - name: Bilan (échec si findings)
        if: always()
        run: |
          AUDIT=0
          if [ -f pnpm-audit.json ]; then
            # Si l'audit n'a pas pu tourner (erreur réseau/registre), échouer explicitement
            if jq -e '.error' pnpm-audit.json >/dev/null; then
              echo "### Audit dépendances : pnpm audit n'a pas pu s'exécuter" >> "$GITHUB_STEP_SUMMARY"
              jq -r '.error.message // .error' pnpm-audit.json >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            AUDIT=$(jq '[.metadata.vulnerabilities // {} | .[]] | add // 0' pnpm-audit.json)
          fi
          TRIVY=0
          if [ -f trivy-fs.json ]; then
            TRIVY=$(jq '[.Results[]? | (.Vulnerabilities // [])[]] | length' trivy-fs.json)
          fi
          echo "### Audit dépendances : $AUDIT vuln(s) pnpm, $TRIVY vuln(s) Trivy" >> "$GITHUB_STEP_SUMMARY"
          [ $((AUDIT + TRIVY)) -eq 0 ]

  docker:
    name: Lint Docker (non bloquant)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: hadolint Dockerfile prod
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: frontend/Dockerfile
      - name: hadolint Dockerfile dev
        if: always()
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: frontend/Dockerfile.dev
      - name: Trivy config (Compose + Dockerfiles)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: json
          output: trivy-config.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-docker
          path: trivy-config.json
          retention-days: 7

  # ──────────────── Étage 2 : déploiement (push main uniquement) ────────────────

  changes:
    name: Détection des changements
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      functions: ${{ steps.filter.outputs.functions }}
      schema: ${{ steps.filter.outputs.schema }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      # Limitation connue : sur un force-push sans ancêtre commun, paths-filter
      # considère tous les fichiers comme modifiés → redéploiement complet.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            functions:
              - 'appwrite.json'
              - 'functions/**'
            # Le schéma (tables) ne vit que dans appwrite.json — pas de push
            # --force du schéma quand seul le code des fonctions change.
            schema:
              - 'appwrite.json'
            infra:
              - 'docker-compose.yml'
              - 'traefik/**'
              # Sans cette entrée, corriger un seuil dans alerts.yml et
              # pousser sur main ne changeait rien sur le VPS : le fichier
              # arrivait par `git pull` au déploiement suivant, déclenché par
              # tout autre chose. Une règle d'alerte corrigée qui n'atteint
              # pas la production est une correction imaginaire.
              - 'monitoring/**'
              # Même raisonnement pour les scripts : ils vivent dans le dépôt
              # mais ne sont embarqués dans aucune image. C'est aussi ce
              # filtre qui porte l'installation du crontab — sans lui, une
              # cadence corrigée dans crontab.konfiturgame resterait lettre
              # morte sur le serveur.
              - 'scripts/**'

  # Note : si infra ET frontend changent dans le même push, ce job recrée le
  # frontend avec l'image existante (nouvelle config compose), puis
  # deploy-frontend reconstruit l'image — bref délai où l'ancienne image
  # tourne avec la nouvelle config. Acceptable : c'est l'image qui tournait déjà.
  deploy-infra:
    name: Déploiement infra (compose / traefik / supervision)
    runs-on: ubuntu-latest
    # `monitoring` n'est exigé que par ce job, seul à expédier monitoring/ :
    # une coquille dans alerts.yml ne doit pas bloquer un déploiement de
    # frontend, qui n'y touche pas.
    needs: [changes, quality, tests, secrets, rgpd, monitoring]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.infra == 'true'
    timeout-minutes: 20
    steps:
      - name: Pull + up sur le VPS
        env:
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: APP_DIR
          command_timeout: 15m
          script: |
            set -e
            cd "$APP_DIR"
            git pull --ff-only origin main
            docker compose -f docker-compose.yml up -d --remove-orphans
            # Les configurations de supervision sont montées en volume, pas
            # embarquées dans l'image : `up -d` ne recrée donc pas ces
            # conteneurs quand seul un fichier change, et l'ancienne
            # configuration reste chargée en mémoire. SIGHUP force la relecture
            # sans redémarrage — pas de trou dans la collecte, pas de perte des
            # silences en cours côté Alertmanager.
            docker compose -f docker-compose.yml kill -s HUP prometheus alertmanager

            # ── Tâches planifiées ────────────────────────────────────────
            # Le crontab est versionné, mais cron ne lit que /etc/cron.d :
            # tant que personne ne l'y copie, une cadence corrigée dans le
            # dépôt ne change rien sur le serveur.
            # Tout contrôle de flux appartient à un script, pas à ce YAML.
            bash scripts/deploy-cron.sh "$APP_DIR"
      - name: Healthcheck frontend
        # UA navigateur obligatoire : proxy.ts bloque `curl/` (bot-detection.ts) → 403.
        # Sans ça le healthcheck se fait jeter par notre propre détection de bots.
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36"
          for i in $(seq 1 10); do
            sleep 10
            code=$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" --max-time 15 https://konfiturgame.fr || echo "000")
            if [ "$code" = "200" ]; then
              echo "Frontend OK (HTTP $code, tentative $i)"
              exit 0
            fi
            echo "Tentative $i/10 : HTTP $code"
          done
          echo "Frontend KO après 10 tentatives"
          exit 1
      - name: Healthcheck Appwrite
        run: |
          for i in $(seq 1 10); do
            sleep 10
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://api.konfiturgame.fr/v1/health || echo "000")
            case "$code" in
              200|401)
                echo "Appwrite OK (HTTP $code — service répond, tentative $i)"
                exit 0
                ;;
            esac
            echo "Tentative $i/10 : HTTP $code"
          done
          echo "Appwrite KO après 10 tentatives"
          exit 1

      # Grafana est la seule surface publique de la supervision. Pas de `-k` : c'est précisément la
      # validation du certificat qu'on veut exercer, le challenge ACME étant
      # en httpChallenge et donc tributaire du DNS.
      # 302 attendu (redirection vers /login), 200 accepté.
      - name: Healthcheck Grafana
        run: |
          for i in $(seq 1 10); do
            sleep 10
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://grafana.konfiturgame.fr || echo "000")
            case "$code" in
              200|302)
                echo "Grafana OK (HTTP $code, tentative $i)"
                exit 0
                ;;
            esac
            echo "Tentative $i/10 : HTTP $code"
          done
          echo "Grafana KO après 10 tentatives — DNS grafana.konfiturgame.fr ou certificat ACME"
          exit 1

      # Les healthchecks ci-dessus prouvent que les surfaces publiques
      # répondent ; celui-ci prouve que la supervision fonctionne. Ce sont
      # deux choses différentes : Prometheus démarre et sert son interface
      # même quand alerts.yml est refusé au chargement il n'évalue
      # simplement plus rien. Panne en vert, le pire des modes.
      #
      # monitoring-check.sh interroge l'API de Prometheus, qui n'est publiée
      # ni sur Internet ni sur l'hôte : il tourne donc SUR le VPS, contre
      # l'IP du conteneur sur monitoring-net. Il exige curl et jq, déjà
      # requis par backup.sh pour l'export API Appwrite.
      #
      # Réessais : scrape_interval est à 30 s (60 s pour cAdvisor), une
      # cible fraîchement démarrée n'a pas encore de point de mesure.
      - name: Smoke test de la supervision
        env:
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: APP_DIR
          command_timeout: 5m
          script: |
            set -e
            cd "$APP_DIR"
            PROM_IP=$(docker inspect \
              -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' \
              konfitur-prometheus)
            [ -n "$PROM_IP" ] || { echo "❌ konfitur-prometheus introuvable"; exit 1; }
            for i in 1 2 3 4 5; do
              if bash scripts/ci/monitoring-check.sh "http://${PROM_IP}:9090"; then
                exit 0
              fi
              echo "── Tentative $i/5 en échec, nouvel essai dans 30 s"
              sleep 30
            done
            echo "❌ Chaîne de supervision non fiable après 5 tentatives"
            exit 1

  deploy-frontend:
    name: Déploiement frontend
    runs-on: ubuntu-latest
    needs: [changes, quality, tests, secrets, rgpd, deploy-infra]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.frontend == 'true' &&
      needs.quality.result == 'success' &&
      needs.tests.result == 'success' &&
      needs.secrets.result == 'success' &&
      needs.rgpd.result == 'success' &&
      (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped')
    timeout-minutes: 30
    steps:
      - name: Pull + build + restart frontend sur le VPS
        env:
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: APP_DIR
          command_timeout: 25m
          # Une commande par ligne, zéro contrôle de flux : drone-ssh insère un
          # test du code retour après CHAQUE ligne. Toute la logique vit dans
          # scripts/deploy-frontend.sh (cf. son en-tête).
          script: |
            set -e
            cd "$APP_DIR"
            git pull --ff-only origin main
            bash scripts/deploy-frontend.sh "$APP_DIR" build
      - name: Healthcheck frontend
        # UA navigateur obligatoire : proxy.ts bloque `curl/` (bot-detection.ts) → 403.
        # Sans ça le healthcheck se fait jeter par notre propre détection de bots.
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36"
          for i in $(seq 1 10); do
            sleep 10
            code=$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" --max-time 15 https://konfiturgame.fr || echo "000")
            if [ "$code" = "200" ]; then
              echo "Frontend OK (HTTP $code, tentative $i)"
              exit 0
            fi
            echo "Tentative $i/10 : HTTP $code"
          done
          echo "Frontend KO après 10 tentatives"
          exit 1

      # Ne s'exécute que si le healthcheck ci-dessus a réussi : `stable` ne doit
      # désigner qu'une image dont on a la preuve qu'elle a servi un 200 depuis
      # l'extérieur. Si la CI meurt ici, `stable` reste sur l'image précédente —
      # le comportement dégradé est le comportement sûr.
      - name: Promotion de l'image en 'stable'
        env:
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: APP_DIR
          script: |
            bash "$APP_DIR/scripts/deploy-frontend.sh" "$APP_DIR" promote

  deploy-functions:
    name: Déploiement Appwrite functions
    runs-on: ubuntu-latest
    needs: [changes, quality, tests, secrets, rgpd]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.functions == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Exception à la règle pnpm du projet : install global d'un outil CLI
      # sur un runner éphémère, aucun impact sur le lockfile du projet.
      - run: npm install -g appwrite-cli@17.3.1
      - name: Push functions vers la prod
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          appwrite client \
            --endpoint https://api.konfiturgame.fr/v1 \
            --project-id 69b1a2b500083affc894 \
            --key "$APPWRITE_API_KEY"
          appwrite push functions --force

  # Phase 2 — le schéma (tables) est capturé dans appwrite.json (source de
  # vérité, voir docs/MISE-A-JOUR.md §7). `push tables` remplace l'ancien
  # `push collections`, déprécié depuis la CLI 17.
  deploy-schema:
    name: Déploiement schéma Appwrite
    runs-on: ubuntu-latest
    needs: [changes, quality, tests, secrets, rgpd]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.schema == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Exception à la règle pnpm du projet : install global d'un outil CLI
      # sur un runner éphémère, aucun impact sur le lockfile du projet.
      - run: npm install -g appwrite-cli@17.3.1
      - name: Push schéma (tables) vers la prod
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          appwrite client \
            --endpoint https://api.konfiturgame.fr/v1 \
            --project-id 69b1a2b500083affc894 \
            --key "$APPWRITE_API_KEY"
          appwrite push tables --force

  # ──────────────── Issues automatiques ────────────────

  report-deploy-failure:
    name: Issue si échec de déploiement
    runs-on: ubuntu-latest
    needs: [deploy-infra, deploy-frontend, deploy-functions, deploy-schema]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.deploy-infra.result == 'failure' ||
       needs.deploy-frontend.result == 'failure' ||
       needs.deploy-functions.result == 'failure' ||
       needs.deploy-schema.result == 'failure')
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    steps:
      - name: Créer ou commenter l'issue deploy-failure
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          R_INFRA: ${{ needs.deploy-infra.result }}
          R_FRONT: ${{ needs.deploy-frontend.result }}
          R_FUNC: ${{ needs.deploy-functions.result }}
          R_SCHEMA: ${{ needs.deploy-schema.result }}
        run: |
          # Crée le label s'il n'existe pas encore (premier run) — idempotent.
          gh label create deploy-failure --repo "$REPO" --force \
            --color D73A4A --description "Échec de déploiement automatique"
          FAILED=""
          if [ "$R_INFRA" = "failure" ]; then FAILED="$FAILED deploy-infra"; fi
          if [ "$R_FRONT" = "failure" ]; then FAILED="$FAILED deploy-frontend"; fi
          if [ "$R_FUNC" = "failure" ]; then FAILED="$FAILED deploy-functions"; fi
          if [ "$R_SCHEMA" = "failure" ]; then FAILED="$FAILED deploy-schema"; fi
          # shellcheck disable=SC2016
          BODY=$(printf '## Échec de déploiement\n\n- **Commit :** `%s`\n- **Jobs en échec :**%s\n- **Logs :** %s\n\nProcédure de rollback : voir `docs/CI-CD.md`.\n' "$SHA" "$FAILED" "$RUN_URL")
          EXISTING=$(gh issue list --repo "$REPO" --label deploy-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "Échec de déploiement sur main" \
              --label deploy-failure --body "$BODY"
          fi

  security-report:
    name: Issue rapport sécurité
    runs-on: ubuntu-latest
    needs: [sast, deps, docker]
    # Issue mise à jour uniquement depuis main — un push develop ne doit pas
    # écraser l'état des findings de la prod.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: security-*
          path: reports
          merge-multiple: true
      - name: Construire le rapport
        id: report
        run: |
          mkdir -p reports
          if ! ls reports/*.json >/dev/null 2>&1; then
            # Aucun artefact téléchargé (scanners en échec ?) — on ne touche pas à l'issue.
            echo "total=indisponible" >> "$GITHUB_OUTPUT"
            echo "Aucun artefact sécurité disponible — gestion d'issue sautée."
            exit 0
          fi
          TOTAL=$(bash scripts/ci/build-security-report.sh reports)
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "Findings totaux : $TOTAL"
      - name: Créer / mettre à jour / fermer l'issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TOTAL: ${{ steps.report.outputs.total }}
        run: |
          case "$TOTAL" in
            ''|*[!0-9]*)
              echo "Total non numérique ('$TOTAL') — rapport indisponible, issue laissée en l'état."
              exit 0
              ;;
          esac
          # Crée le label s'il n'existe pas encore (premier run) — idempotent.
          gh label create security-report --repo "$REPO" --force \
            --color D93F0B --description "Rapport sécurité CI"
          EXISTING=$(gh issue list --repo "$REPO" --label security-report --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ "$TOTAL" -eq 0 ]; then
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --repo "$REPO" \
                --comment "Plus aucun finding sécurité sur main — fermeture automatique."
            fi
            echo "Aucun finding — pas d'issue."
          elif [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "$REPO" --body-file reports/security-report.md
          else
            gh issue create --repo "$REPO" --title "Rapport sécurité automatique" \
              --label security-report --body-file reports/security-report.md
          fi
