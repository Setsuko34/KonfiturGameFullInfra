# Config pnpm (pnpm >= 10 lit overrides/allowBuilds ici, plus dans package.json)
overrides:
  # Garde-fous sur des dépendances TRANSITIVES de next. Ils sont posés au
  # niveau de la version corrigée par l'avis, pas au-dessus : un override plus
  # large ferait silencieusement diverger l'arbre de ce que next a testé.
  #
  # `postcss` reste épinglé exactement par next (16.3.5 → 8.5.23), donc
  # l'override est le seul levier. `sharp` en revanche est désormais demandé
  # en `^0.35.4` par next : l'override ne fait plus que verrouiller le plancher
  # contre une régression en amont.
  "postcss@<8.5.23": ">=8.5.23"
  "sharp@<0.35.4": ">=0.35.4"
  "nanoid@<3.3.18": "^3.3.18"
  "brace-expansion@<1.1.16": "^1.1.16"
  "brace-expansion@>=3.0.0 <5.0.7": "^5.0.7"
  # `^4.3.2` et non `>=4.3.2` : le correctif de GHSA-2883-xcg3-v3hh vit dans la
  # ligne 4.x, alors que la dernière js-yaml est une 5.x, un majeur qu'aucun
  # consommateur de l'arbre (eslintrc) n'a validé.
  "js-yaml@>=4.0.0 <4.3.2": "^4.3.2"

# pnpm >= 10 bloque les scripts postinstall par défaut — allowlist explicite,
# sinon sharp/esbuild installés sans leurs binaires natifs (build Next cassé).
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
